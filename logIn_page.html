<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank system</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="login_form">
        <section class="container">
            <img src="assets/payoo.png" alt="">
            <section class="content">
                <h3>Mobile Number</h3>
                <input type="text" name="" id="phone_number" placeholder="Enter your phone number">
                <h3>4 Digit Pin</h3>
                <input type="password" name="" id="pin_number" placeholder="Enter your pin">
                <span class="link"><a href="#">Forget Password</a></span>
                <button id="login_btn">Log In</button>
            </section>
        </section>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
